plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { instr ->
        keystoreProperties.load(instr)
    }
}

android {
    // Redirigir la carpeta build a /tmp
    project.layout.buildDirectory.set(file("/tmp/k150"))

    namespace 'com.diamon.pic'
    compileSdk 37

    defaultConfig {
        applicationId "com.diamon.pic"
        minSdk 24
        targetSdk 37
        versionCode 61
        versionName "2.9.7"

        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            } else {
                def envStoreFile = System.getenv("SIGNING_STORE_FILE")
                storeFile = envStoreFile ? file(envStoreFile) : null
                storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            // Crashlytics 857da161...: el resource shrinker de AGP eliminó los
            // PNG de AppCompat referenciados por abc_switch_thumb_material y el
            // SwitchCompat de activity_main no pudo inflarse en Android 12.
            // Mantener todos los recursos evita referencias colgantes en el APK.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildToolsVersion '37.0.0'
    ndkVersion '30.0.14904198 rc1'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '4.1.2'
        }
    }

    buildFeatures {
        resValues true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}


dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // Compatibilidad API 23+
    implementation libs.vectordrawable
    implementation libs.firebase.crashlytics
    testImplementation libs.junit
    testImplementation libs.mockito.core
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation(libs.usb.serial.for1.android)
    implementation libs.appcenter.analytics
    implementation libs.appcenter.crashes
    implementation libs.play.services.ads
    // UMP: consentimiento de privacidad (RGPD / normativas estatales de EE. UU.)
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // play-services-ads-api 25.5.0 arrastra hsdp 2.0.1, que lanza
    // "targetPackageName is null" en HsdpShimActivity. 2.2.0 cierra la
    // actividad limpiamente cuando el intent no trae los extras.
    implementation libs.hsdp
    implementation libs.billing
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.messaging
    implementation libs.firebase.firestore
    implementation libs.admob.mediation
    // Add the dependencies for the Crashlytics NDK and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation(libs.firebase.crashlytics.ndk)
    implementation(libs.google.firebase.analytics)
}
